name: Java CI

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 16
        distribution: 'zulu'
        show-distribution-progress: true
    - name: Build with Maven
      run: mvn -B verify
